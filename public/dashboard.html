<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Colmedikal</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #334155; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-top: 0; color: #0C4169; }
        .form-group { margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: #0C4169; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0a3556; }
        #dataList { margin-top: 30px; }
        .form-card { border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <h1>Acceso al Dashboard</h1>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ingrese la contraseña">
        </div>
        <button onclick="login()">Ingresar</button>
        <p id="errorMsg" style="color: red; display: none;"></p>
    </div>

    <div class="container" id="dashboardContainer" style="display: none;">
        <h1>Formularios Recibidos</h1>
        <button onclick="logout()" style="background: #ef4444; margin-bottom: 20px;">Cerrar Sesión</button>
        <div id="dataList">Cargando datos...</div>
    </div>

<script>
const API_URL = '/api';

async function checkAuth() {
  const token = localStorage.getItem('admin_token');
  if (!token) return;

  try {
    const res = await fetch(`${API_URL}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.ok) {
      showDashboard();
      loadForms(); // ✅ AÑADIR ESTO
    } else {
      logout();
    }
  } catch (error) {
    console.error(error);
  }
}

async function login() {
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });

    const data = await res.json();

    if (data.success) {
      localStorage.setItem('admin_token', data.token);
      errorMsg.style.display = 'none';
      showDashboard();
      loadForms(); // ✅ AÑADIR ESTO
    } else {
      errorMsg.textContent = data.message || 'Error de autenticación';
      errorMsg.style.display = 'block';
    }
  } catch (error) {
    errorMsg.textContent = 'Error de conexión';
    errorMsg.style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('admin_token');
  document.getElementById('loginContainer').style.display = 'block';
  document.getElementById('dashboardContainer').style.display = 'none';
  document.getElementById('password').value = '';
}

async function loadForms() { // ✅ NUEVA FUNCIÓN
  const token = localStorage.getItem('admin_token');

  try {
    const res = await fetch(`${API_URL}/forms`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    const data = await res.json();
    const dataList = document.getElementById('dataList');

    if (data.success) {
      if (!data.forms || data.forms.length === 0) {
        dataList.innerHTML = '<p>No hay formularios registrados</p>';
        return;
      }

      dataList.innerHTML = data.forms.map(form => `
        <div class="form-card">
          <strong>Tipo:</strong> ${form.type}<br>
          <strong>Fecha:</strong> ${new Date(form.createdAt || Date.now()).toLocaleString()}<br>
          <pre style="margin-top: 10px; background: white; padding: 10px; border-radius: 4px; overflow-x: auto;">${JSON.stringify(form.data, null, 2)}</pre>
        </div>
      `).join('');
    } else {
      dataList.innerHTML = '<p>Error al cargar los datos</p>';
    }
  } catch (error) {
    console.error('Error cargando formularios:', error);
    document.getElementById('dataList').innerHTML = '<p>Error de conexión</p>';
  }
}

function showDashboard() {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('dashboardContainer').style.display = 'block';
}

// ✅ LLAMAR checkAuth() AL CARGAR LA PÁGINA
window.addEventListener('load', checkAuth);
</script>
</body>
</html>
